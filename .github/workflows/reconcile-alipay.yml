name: Reconcile Alipay payments

on:
  schedule:
    # Run every five minutes, offset from the top of the hour to reduce queueing.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-alipay-payments
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reconcile pending Alipay orders
        env:
          CRON_SECRET: ${{ secrets.ECHO_RECONCILE_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            https://echomap.syan12.cn/api/payments/reconcile
