<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b7caf5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Echo Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Cormorant+Garamond:wght@500&family=Gasoek+One&family=Nunito:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Roboto+Mono:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Helvetica Neue', system-ui, sans-serif;
        overflow-x: hidden;
        min-height: 100dvh;
      }
      @keyframes fadeInOut {
        0%, 100% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
        10%, 90% { opacity: 1; transform: translateY(0) translateX(-50%); }
      }
      .animate-toast {
        animation: fadeInOut 5s ease-in-out forwards;
      }
      /* 主栏纵向滑动隐藏滚动条，仍可用滚轮 / 触控滑动 */
      .scrollbar-hide {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      /* 侧栏品牌白云：横向漂移 + 轻微上下浮动，透明度随动画略变 */
      @keyframes echoCloudFloat {
        0% { transform: translate(-12%, 0); opacity: 0.675; }
        35% { transform: translate(18%, -5px); opacity: 1; }
        70% { transform: translate(42%, 3px); opacity: 0.8625; }
        100% { transform: translate(58%, 0); opacity: 0.75; }
      }
      @keyframes echoCloudFloatSlow {
        0% { transform: translate(8%, 4px); opacity: 0.55; }
        50% { transform: translate(-6%, -8px); opacity: 1; }
        100% { transform: translate(22%, 2px); opacity: 0.625; }
      }
      @keyframes echoCloudFloatSoft {
        0% { transform: translate(30%, -4px); opacity: 0.4375; }
        45% { transform: translate(8%, 6px); opacity: 0.825; }
        100% { transform: translate(-4%, -2px); opacity: 0.5125; }
      }
      .echo-cloud-a {
        animation: echoCloudFloat 13.2s ease-in-out infinite;
      }
      .echo-cloud-b {
        animation: echoCloudFloatSlow 16.8s ease-in-out infinite;
        animation-delay: -3.6s;
      }
      .echo-cloud-c {
        animation: echoCloudFloatSoft 20.4s ease-in-out infinite;
        animation-delay: -8.4s;
      }
      /* 超大 / 特小云：与 a–c 节奏区分 */
      @keyframes echoCloudFloatXL {
        0%, 100% { transform: translate(-4%, 2%); }
        40% { transform: translate(6%, -4px); }
      }
      @keyframes echoCloudFloatTiny {
        0% { transform: translate(0, 0) scale(1); opacity: 0.4375; }
        40% { transform: translate(-6px, 5px) scale(1.06); opacity: 0.675; }
        100% { transform: translate(4px, -3px) scale(1); opacity: 0.475; }
      }
      @keyframes echoCloudFloatMeander {
        0% { transform: translate(2%, 0); opacity: 0.3625; }
        50% { transform: translate(-8%, 6px); opacity: 0.6; }
        100% { transform: translate(4%, -2px); opacity: 0.375; }
      }
      .echo-cloud-xl {
        animation: echoCloudFloatXL 22.8s ease-in-out infinite;
      }
      .echo-cloud-tiny {
        animation: echoCloudFloatTiny 9.6s ease-in-out infinite;
        animation-delay: -1.8s;
      }
      .echo-cloud-meander {
        animation: echoCloudFloatMeander 15.6s ease-in-out infinite;
        animation-delay: -5.4s;
      }
      .mapboxgl-ctrl-bottom-left,
      .mapboxgl-ctrl-bottom-right {
        opacity: 0.42;
        transform: scale(0.92);
        transform-origin: left bottom;
      }
      .mapboxgl-ctrl-logo,
      .mapboxgl-ctrl-attrib {
        filter: grayscale(1);
      }
      .echo-atlas-base {
        background:
          radial-gradient(circle at 18% 16%, rgba(163, 196, 214, 0.16), transparent 24%),
          radial-gradient(circle at 77% 22%, rgba(173, 199, 220, 0.11), transparent 20%),
          radial-gradient(circle at 66% 68%, rgba(150, 188, 210, 0.11), transparent 22%),
          radial-gradient(circle at 34% 76%, rgba(183, 202, 245, 0.08), transparent 18%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 241, 227, 0.92));
      }
      .echo-atlas-graticule {
        background-image:
          linear-gradient(rgba(103, 124, 144, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 124, 144, 0.08) 1px, transparent 1px);
        background-size: 72px 72px, 72px 72px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.48));
      }
      .echo-atlas-vignette {
        background:
          radial-gradient(circle at center, transparent 52%, rgba(231, 223, 205, 0.34) 100%);
      }
      .echo-map-shell {
        transition: opacity 180ms ease-out;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0",
    "tone": "https://aistudiocdn.com/tone@^15.0.4"
  }
}
</script>
</head>
<body class="bg-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
